<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><title>Graf Spee 接入检查</title><script type="importmap">{"imports": {"three": "../vendor/three.module.js", "../js/config.js": "../js/config.js?v=d9f5a2e4c3df", "../js/AssetLoader.js": "../js/AssetLoader.js?v=d9f5a2e4c3df"}}</script><style>body{margin:0;background:#102936;color:#eee;font:14px Arial}canvas{display:block;width:100%;height:360px}pre{white-space:pre-wrap}</style></head><body><p>巡洋舰模型检查</p><main></main><pre id="model-report">载入中</pre><script type="module">
import * as THREE from 'three';import {AssetLoader} from '../js/AssetLoader.js';
const loader=new AssetLoader(),raw=await loader.loadGLB('cruiser','../assets/models/graf_spee_low_poly.glb');
const inner=loader.normalize(raw,'cruiser');const size=new THREE.Box3().setFromObject(inner).getSize(new THREE.Vector3());
const scene=new THREE.Scene();scene.background=new THREE.Color('#598ba0');scene.add(inner);scene.add(new THREE.HemisphereLight(0xe0f2ff,0x59675c,2.5));const sun=new THREE.DirectionalLight(0xfff4df,3);sun.position.set(60,100,60);scene.add(sun);
const sea=new THREE.Mesh(new THREE.PlaneGeometry(300,300),new THREE.MeshStandardMaterial({color:0x286477,roughness:.7}));sea.rotation.x=-Math.PI/2;scene.add(sea);
const cameras=[[70,45,80],[100,14,0],[0,90,0]];
for(const [i,pos] of cameras.entries()){const r=new THREE.WebGLRenderer({antialias:true});r.setSize(960,360);r.toneMapping=THREE.ACESFilmicToneMapping;r.toneMappingExposure=1.1;const c=new THREE.PerspectiveCamera(42,960/360,.1,1000);c.position.set(...pos);c.lookAt(0,4,0);r.domElement.id='view-'+i;document.querySelector('main').append(r.domElement);r.render(scene,c);}
let meshes=0,triangles=0;raw.traverse(n=>{if(n.isMesh){meshes++;triangles+=(n.geometry.index?.count||n.geometry.attributes.position.count)/3;}});document.querySelector('#model-report').textContent=JSON.stringify({meshes,triangles,size:size.toArray(),bounds:new THREE.Box3().setFromObject(inner),waterline:.17,loaded:true},null,2);
</script></body></html>
